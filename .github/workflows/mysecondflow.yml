name: 2ndworkflow
on:
  workflow_dispatch:
jobs:
  codecheckout:
    runs-on: ubuntu-latest
    steps:
      - name: Git code checkout
        run: echo "code is checked out"

  build:
    runs-on: ubuntu-latest
    needs: codecheckout
    steps:
      - name: Build the code
        run: echo "code is built"
  test:
    runs-on: ubuntu-latest
    needs:
      - codecheckout
      - build
    steps:
      - name: Test the Code
        run: echo "code test is completed"
      

